<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My To-Do List</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>My To-Do List</h1>
        <p>Manage your daily tasks efficiently</p>
    </header>

    <main class="container">

        <section class="task-form">
            <h2>Add a New Task</h2>

            <form id="taskForm">
                <input
                    type="text"
                    id="taskName"
                    placeholder="Enter task name"
                    required
                >

                <textarea
                    id="taskDescription"
                    placeholder="Enter task description"
                    required
                ></textarea>

                <button type="submit">Add Task</button>
            </form>
        </section>

        <section class="task-section">
            <h2>Your Tasks</h2>

            <div class="task-summary">
                <p>Total Tasks: <span id="totalTasks">0</span></p>
                <p>Completed: <span id="completedTasks">0</span></p>
                <p>Pending: <span id="pendingTasks">0</span></p>
            </div>

            <div id="taskList"></div>
        </section>

    </main>

        <script>
    let allTasks = []; // Stores tasks safely in memory

    // 1. Load tasks when the page opens
    async function loadTasks() {
        const response = await fetch('/api/tasks');
        allTasks = await response.json();
        
        document.getElementById('totalTasks').innerText = allTasks.length;
        document.getElementById('completedTasks').innerText = allTasks.filter(t => t.task_status === 'Completed').length;
        document.getElementById('pendingTasks').innerText = allTasks.filter(t => t.task_status === 'Pending').length;

        const listContainer = document.getElementById('taskList');
        listContainer.innerHTML = '';

        allTasks.forEach(task => {
            const isDone = task.task_status === 'Completed';

            listContainer.innerHTML += `
                <div style="border-bottom: 1px solid #eee; padding: 12px 0; display: flex; justify-content: space-between; align-items: center;">
                    <div>
                        <strong style="text-decoration: ${isDone ? 'line-through' : 'none'}">${task.task_name}</strong>
                        <p style="margin: 4px 0; color: #666; font-size: 14px;">${task.task_description || ''}</p>
                        <small style="color: ${isDone ? 'green' : 'orange'}; font-weight: bold;">${task.task_status}</small>
                    </div>
                    <div>
                        <button type="button" onclick="toggleStatus(${task.task_id})">
                            ${isDone ? 'Mark Pending' : 'Complete'}
                        </button>
                        <button type="button" onclick="editTask(${task.task_id})">Edit</button>
                        <button type="button" onclick="deleteTask(${task.task_id})" style="color: red;">Delete</button>
                    </div>
                </div>
            `;
        });
    }

    // 2. Listen for form submission to add a new task
    document.getElementById('taskForm').addEventListener('submit', async function(e) {
        e.preventDefault();

        const nameInput = document.getElementById('taskName');
        const descInput = document.getElementById('taskDescription');

        await fetch('/api/tasks', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                task_name: nameInput.value,
                task_description: descInput.value
            })
        });

        nameInput.value = '';
        descInput.value = '';
        loadTasks();
    });

    // 3. Toggle task status
    async function toggleStatus(id) {
        const task = allTasks.find(t => t.task_id === id);
        if (!task) return;

        const newStatus = task.task_status === 'Pending' ? 'Completed' : 'Pending';
        await fetch(`/api/tasks/${id}`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                task_name: task.task_name,
                task_description: task.task_description,
                task_status: newStatus
            })
        });
        loadTasks();
    }

    // 4. Edit task name and description
    async function editTask(id) {
        const task = allTasks.find(t => t.task_id === id);
        if (!task) return;

        const newName = prompt('Edit Task Name:', task.task_name);
        if (newName === null || !newName.trim()) return;

        const newDesc = prompt('Edit Task Description:', task.task_description || '');
        if (newDesc === null) return;

        await fetch(`/api/tasks/${id}`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                task_name: newName,
                task_description: newDesc,
                task_status: task.task_status
            })
        });
        loadTasks();
    }

    // 5. Delete a task
    async function deleteTask(id) {
        if (!confirm('Are you sure you want to delete this task?')) return;
        await fetch(`/api/tasks/${id}`, { method: 'DELETE' });
        loadTasks();
    }

    // Run on page load
    loadTasks();
    </script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My To-Do List</title>
    <link rel="stylesheet" href="styles.css">;
    <!-- Bootstrap 5.3 CSS via jsDelivr CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <!-- Full-Width Responsive Header -->
    <header class="bg-primary text-white text-center py-4 mb-4 shadow-sm">
        <div class="container">
            <h1 class="fw-bold mb-1">My To-Do List</h1>
            <p class="mb-0">Manage your daily tasks efficiently</p>
        </div>
    </header>

    <!-- Mobile-First Grid Container -->
    <main class="container pb-5">
        <div class="row g-4">

            <!-- Left Column: Stacks full-width on mobile (col-12), takes 4/12 columns on desktop (col-lg-4) -->
            <section class="col-12 col-lg-4">
                <div class="card shadow-sm border-0">
                    <div class="card-body p-4">
                        <h2 class="h4 card-title mb-3">Add a New Task</h2>

                        <form id="taskForm">
                            <div class="mb-3">
                                <label for="taskName" class="form-label visually-hidden">Task Name</label>
                                <input
                                    type="text"
                                    id="taskName"
                                    class="form-control"
                                    placeholder="Enter task name"
                                    required
                                >
                            </div>

                            <div class="mb-3">
                                <label for="taskDescription" class="form-label visually-hidden">Task Description</label>
                                <textarea
                                    id="taskDescription"
                                    class="form-control"
                                    rows="3"
                                    placeholder="Enter task description"
                                    required
                                ></textarea>
                            </div>

                            <button type="submit" class="btn btn-primary w-100 fw-semibold">Add Task</button>
                        </form>
                    </div>
                </div>
            </section>

            <!-- Right Column: Stacks full-width on mobile (col-12), takes 8/12 columns on desktop (col-lg-8) -->
            <section class="col-12 col-lg-8">
                <div class="card shadow-sm border-0">
                    <div class="card-body p-4">
                        <h2 class="h4 card-title mb-3">Your Tasks</h2>

                        <!-- Responsive Summary Pills -->
                        <div class="d-flex flex-wrap gap-2 mb-4">
                            <span class="badge bg-secondary fs-6 py-2 px-3">
                                Total Tasks: <span id="totalTasks">0</span>
                            </span>
                            <span class="badge bg-success fs-6 py-2 px-3">
                                Completed: <span id="completedTasks">0</span>
                            </span>
                            <span class="badge bg-warning text-dark fs-6 py-2 px-3">
                                Pending: <span id="pendingTasks">0</span>
                            </span>
                        </div>

                        <!-- Task List Container -->
                        <div id="taskList" class="list-group"></div>
                    </div>
                </div>
            </section>

        </div>
    </main>

    <script>
    let allTasks = []; // Stores tasks safely in memory

    // 1. Load tasks when the page opens
    async function loadTasks() {
        const response = await fetch('/api/tasks');
        allTasks = await response.json();
        
        document.getElementById('totalTasks').innerText = allTasks.length;
        document.getElementById('completedTasks').innerText = allTasks.filter(t => t.task_status === 'Completed').length;
        document.getElementById('pendingTasks').innerText = allTasks.filter(t => t.task_status === 'Pending').length;

        const listContainer = document.getElementById('taskList');
        listContainer.innerHTML = '';

        if (allTasks.length === 0) {
            listContainer.innerHTML = `<div class="text-center text-muted py-4">No tasks yet. Add your first task!</div>`;
            return;
        }

        allTasks.forEach(task => {
            const isDone = task.task_status === 'Completed';

            // Mobile-first flex layout: stacks vertically on phones (flex-column), aligns horizontally on tablets/desktops (flex-sm-row)
            listContainer.innerHTML += `
                <div class="list-group-item list-group-item-action p-3 d-flex flex-column flex-sm-row justify-content-between align-items-sm-center gap-3">
                    <div>
                        <div class="fw-bold ${isDone ? 'text-decoration-line-through text-muted' : ''}">
                            ${task.task_name}
                        </div>
                        <p class="mb-2 text-muted small">${task.task_description || ''}</p>
                        <span class="badge ${isDone ? 'bg-success' : 'bg-warning text-dark'}">
                            ${task.task_status}
                        </span>
                    </div>
                    <div class="btn-group btn-group-sm align-self-start align-self-sm-center">
                        <button type="button" class="btn btn-outline-success" onclick="toggleStatus(${task.task_id})">
                            ${isDone ? 'Mark Pending' : 'Complete'}
                        </button>
                        <button type="button" class="btn btn-outline-primary" onclick="editTask(${task.task_id})">
                            Edit
                        </button>
                        <button type="button" class="btn btn-outline-danger" onclick="deleteTask(${task.task_id})">
                            Delete
                        </button>
                    </div>
                </div>
            `;
        });
    }

    // 2. Listen for form submission to add a new task
    document.getElementById('taskForm').addEventListener('submit', async function(e) {
        e.preventDefault();

        const nameInput = document.getElementById('taskName');
        const descInput = document.getElementById('taskDescription');

        await fetch('/api/tasks', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                task_name: nameInput.value,
                task_description: descInput.value
            })
        });

        nameInput.value = '';
        descInput.value = '';
        loadTasks();
    });

    // 3. Toggle task status
    async function toggleStatus(id) {
        const task = allTasks.find(t => t.task_id === id);
        if (!task) return;

        const newStatus = task.task_status === 'Pending' ? 'Completed' : 'Pending';
        await fetch(`/api/tasks/${id}`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                task_name: task.task_name,
                task_description: task.task_description,
                task_status: newStatus
            })
        });
        loadTasks();
    }

    // 4. Edit task name and description
    async function editTask(id) {
        const task = allTasks.find(t => t.task_id === id);
        if (!task) return;

        const newName = prompt('Edit Task Name:', task.task_name);
        if (newName === null || !newName.trim()) return;

        const newDesc = prompt('Edit Task Description:', task.task_description || '');
        if (newDesc === null) return;

        await fetch(`/api/tasks/${id}`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                task_name: newName,
                task_description: newDesc,
                task_status: task.task_status
            })
        });
        loadTasks();
    }

    // 5. Delete a task
    async function deleteTask(id) {
        if (!confirm('Are you sure you want to delete this task?')) return;
        await fetch(`/api/tasks/${id}`, { method: 'DELETE' });
        loadTasks();
    }

    // Run on page load
    loadTasks();
    </script>

</body>
</html>
